services:
  postgres:
    image: postgres:18-alpine
    env_file:
      - .env
    volumes:
      # postgres:18+ images store data in a pg_ctlcluster-style layout and
      # expect the volume mounted at the parent directory, not .../data
      # directly (see docs/learnings/learnings.md in web/home for the
      # startup error this avoids).
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"

  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data

  prod:
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
